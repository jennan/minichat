services:

  vllm:
    image: docker.io/vllm/vllm-openai:latest
    container_name: vllm-server
    expose:
      - "8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: --model "Qwen/Qwen3-0.6B" --reasoning-parser qwen3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1-full
    container_name: mlflow-server
    ports:
      - "5000:5000"  # TODO switch to expose once nginx is added
    command: mlflow server --host 0.0.0.0 --disable-security-middleware

  db:
    image: docker.io/library/postgres:latest
    container_name: litellm-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    env_file:
      - .env
    #volumes:
    #  - postgres_data:/var/lib/postgresql/data # Persists Postgres data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-server
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    #command: --config /app/config.yaml --detailed_debug
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
    env_file:
      - .env
    depends_on:
      - db
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s  # Health check command times out after 10 seconds
      retries: 3  # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  chatbot:
    build: .
    ports:
      - "8501:8501"  # TODO switch to expose once nginx is added
    environment:
      MODEL_ID: "hosted_vllm/Qwen/Qwen3-0.6B"
      BASE_URL: "http://vllm:8000/v1"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    depends_on:
      - vllm
      - mlflow
      - litellm
