services:

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-server
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # TODO add healthcheck

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1-full
    container_name: mlflow-server
    # TODO add a volume for mlflow.db
    ports:
      - "5000:5000"  # TODO switch to expose once nginx is added
    command: mlflow server --host 0.0.0.0 --disable-security-middleware
    # TODO add healthcheck

  chatbot:
    build: .
    ports:
      - "8501:8501"  # TODO switch to expose once nginx is added
    environment:
      MODEL_ID: "phi3:mini-4k"
      OLLAMA_HOST: "http://ollama:11434"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    depends_on:
      - ollama
      - mlflow

volumes:
  ollama_data:
