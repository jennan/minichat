services:

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-server
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # healthcheck:
    #   test: ["CMD", "ollama", "list"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1-full
    container_name: mlflow-server
    # TODO add a volume for mlflow.db
    expose:
      - "5000"
    command: mlflow server --host 0.0.0.0 --disable-security-middleware
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5000"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  chatbot:
    build: .
    ports:
      - "8501"
    environment:
      MODEL_ID: "ministral-3"
      OLLAMA_HOST: "http://ollama:11434"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    depends_on:
      - ollama
      - mlflow

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z
    depends_on:
      - mlflow
      - chatbot

volumes:
  ollama_data:
